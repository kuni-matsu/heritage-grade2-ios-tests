name: Public runner and safe fixture checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate public-only test fixture
        run: |
          python3 scripts/check_fixture.py
          python3 scripts/check-public-storekit.py
  macos-check:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode and public fixture
        run: |
          xcodebuild -version
          swift test
          xcodebuild -list
          xcrun simctl list devices available
          xcodebuild -scheme Grade2StoreKitSandbox -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -scheme Grade2StoreKitSandbox -destination 'platform=iOS Simulator,name=iPhone 17 Pro' CODE_SIGNING_ALLOWED=NO test
          python3 scripts/check_fixture.py
          python3 scripts/check-public-storekit.py
