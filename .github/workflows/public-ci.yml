name: Public runner and safe fixture checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate public-only test fixture
        run: |
          python3 scripts/check_fixture.py
          python3 scripts/check-public-storekit.py
  macos-check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode and public fixture
        run: |
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          xcodebuild -project Grade2SyntheticHost.xcodeproj -scheme SyntheticHost -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 CODE_SIGNING_ALLOWED=NO test
          python3 scripts/check_fixture.py
          python3 scripts/check-public-storekit.py
