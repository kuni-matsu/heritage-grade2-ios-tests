name: Public runner and safe fixture checks

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: synthetic-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate public-only test fixture
        run: |
          python3 scripts/check_fixture.py
          python3 scripts/check-public-storekit.py
          python3 scripts/test-select-simulator.py
  macos-check:
    # Xcode 26 / iOS 26.5 CLI StoreKit sync is unreliable; use Xcode 16.4 + iOS 18.5.
    # Try the separate Intel pool while GitHub-hosted Apple Silicon runners are unavailable.
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode and public fixture
        run: |
          xcodebuild -version
          xcodebuild -version | grep -F 'Xcode 16.4'
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          python3 scripts/attach-storekit-scheme.py
          xcrun simctl list devices available
          SIMULATOR_ID="$(python3 scripts/select-simulator.py)"
          echo "Selected iOS simulator: $SIMULATOR_ID"
          if ! xcrun simctl list devices booted | grep -Fq "$SIMULATOR_ID"; then
            xcrun simctl boot "$SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild -project Grade2SyntheticHost.xcodeproj -scheme SyntheticHost -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 CODE_SIGNING_ALLOWED=NO test
          python3 scripts/check_fixture.py
          python3 scripts/check-public-storekit.py
